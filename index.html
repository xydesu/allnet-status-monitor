    const savedMode = localStorage.getItem('allnet_mode');
    if (savedMode) document.documentElement.dataset.mode = savedMode;
    const savedLang = localStorage.getItem('allnet_lang');
    if (savedLang) document.documentElement.lang = savedLang;

        </div>
      </nav>
    </header>

        <div class="summary-strip">
          <div class="summary-cell">

            <span id="label-uptime" class="summary-tag">全體在線率</span>

            <span id="label-online" class="summary-tag">正常運行節點</span>

          <div class="incident-info">
            <svg id="incident-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-error)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

              <line x1="12" y1="9" x2="12" y2="13"></line>

            <span id="incident-text">偵測到異常離線節點</span>

    let pollIntervalSeconds = 60;
    let secondsToNextPoll = pollIntervalSeconds;
    let isFetching = false;

    // ── 語言切換應用 ──
    function applyLanguage(lang) {
      if (!I18N[lang]) lang = 'zh-Hant';
      currentLang = lang;
      localStorage.setItem('allnet_lang', lang);
      document.documentElement.lang = lang;

      const t = I18N[lang];
      document.getElementById('page-title').textContent = t.pageTitle;
      document.getElementById('service-search').placeholder = t.searchPlaceholder;
      document.getElementById('refresh-btn').textContent = t.refreshBtn;
      document.getElementById('hero-headline').textContent = t.heroHeadline;
      document.getElementById('hero-lead-text').textContent = t.heroLead;
      document.getElementById('label-uptime').textContent = t.labelUptime;
      document.getElementById('label-online').textContent = t.labelOnline;
      document.getElementById('label-offline').textContent = t.labelOffline;
      document.getElementById('label-interval').textContent = t.labelInterval;
      document.getElementById('matrix-title').textContent = t.matrixTitle;
      document.getElementById('cat-net-title').textContent = t.catNet;
      document.getElementById('cat-aime-title').textContent = t.catAime;
      document.getElementById('cat-web-title').textContent = t.catWeb;

      const langSelect = document.getElementById('lang-select');
      if (langSelect) langSelect.value = lang;

      if (latestData) {
        renderAll(latestData);
      }
    }

    // ── 深色 / 淺色模式切換 ──
    const themeBtn = document.getElementById('theme-toggle-btn');
    function updateThemeBtnText() {
      const isDark = document.documentElement.dataset.mode === 'dark' || 
        (!document.documentElement.dataset.mode && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (themeBtn) {
        themeBtn.textContent = isDark ? (currentLang === 'en' ? 'Light Mode' : (currentLang === 'ja' ? 'ライト表示' : '淺色模式'))
                                      : (currentLang === 'en' ? 'Dark Mode' : (currentLang === 'ja' ? 'ダーク表示' : '深色模式'));
      }
    }

    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const currentMode = document.documentElement.dataset.mode;
        const newMode = (currentMode === 'dark') ? 'light' : 'dark';
        document.documentElement.dataset.mode = newMode;
        localStorage.setItem('allnet_mode', newMode);
        updateThemeBtnText();
      });
    }

    const langSelect = document.getElementById('lang-select');
    if (langSelect) {
      langSelect.addEventListener('change', (e) => {
        applyLanguage(e.target.value);
        updateThemeBtnText();
      });
    }

    // ── 格式化狀態標籤 ──
    function getStatusBadgeInfo(s, t) {
      if (s.is_online) {
        const msText = s.elapsed_ms > 0 ? ` · ${s.elapsed_ms}ms` : '';
        return {
          cssClass: 'online',
          text: `${t.badgeNormal}${msText}`
        };
      }

      const code = s.status_code || 0;
      const type = s.error_type || '';

      if (code === 503 || type === 'maintenance') {
        return { cssClass: 'offline', text: t.badgeMaint };
      }
      if (code === 403 || type === 'access_denied') {
        return { cssClass: 'offline', text: t.badgeJapanOnly };
      }
      if (type === 'timeout') {
        return { cssClass: 'offline', text: t.badgeTimeout };
      }
      if (type === 'dns_error') {
        return { cssClass: 'offline', text: t.badgeDnsError };
      }
      if (type === 'conn_refused') {
        return { cssClass: 'offline', text: t.badgeConnRefused };
      }
      if (code >= 400 && code < 500) {
        return { cssClass: 'offline', text: t.badgeClientError };
      }
      if (code >= 500) {
        return { cssClass: 'offline', text: t.badgeServerError };
      }
      return { cssClass: 'offline', text: t.badgeNetworkError };
    }

    // ── 生成輕量純 SVG Sparkline 走勢圖 ──
    function generateSparklineSVG(history, t) {
      if (!Array.isArray(history) || history.length < 2) {
        return `<span class="sparkline-insufficient">${t.sparklinePending}</span>`;
      }
      const w = 72;
      const h = 20;
      const p = 3;
      const msList = history.map(item => Math.max(1, item.ms || 0));
      const min = Math.min(...msList);
      const max = Math.max(...msList);
      const range = (max === min) ? 1 : (max - min);

      const points = history.map((item, idx) => {
        const x = p + (idx / (history.length - 1)) * (w - p * 2);
        const y = (h - p) - ((item.ms - min) / range) * (h - p * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');

      const last = history[history.length - 1];
      const strokeColor = last.ok ? 'var(--color-success)' : 'var(--color-error)';
      const lastX = (w - p);
      const lastY = (h - p) - ((last.ms - min) / range) * (h - p * 2);

      return `
        <svg class="sparkline-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
          <polyline fill="none" stroke="${strokeColor}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" points="${points}" />
          <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="2" fill="${strokeColor}" />
        </svg>
      `;
    }

    // ── 分組內智慧排序 (異常優先置頂) ──
    function sortServicesInGroup(services) {
      return [...services].sort((a, b) => {
        // 異常者 (is_online === false) 置頂
        if (a.is_online !== b.is_online) {
          return a.is_online ? 1 : -1;
        }
        // 延遲高者在前
        return (b.elapsed_ms || 0) - (a.elapsed_ms || 0);
      });
    }

    // ── 格式化時間 ──
    function formatTime(isoStr) {
      if (!isoStr) return I18N[currentLang].diagNever;
      try {
        const d = new Date(isoStr);
        return d.toLocaleString(currentLang, { hour12: false });
      } catch (e) {
        return isoStr;
      }
    }

    // ── 渲染全部介面 ──
    function renderAll(data) {
      latestData = data;
      const t = I18N[currentLang];
      const services = Array.isArray(data.services) ? data.services : [];

      const total = services.length;
      const onlineCount = services.filter(s => s.is_online).length;
      const offlineCount = total - onlineCount;
      const uptimePct = total > 0 ? ((onlineCount / total) * 100).toFixed(1) : 'N/A';

      // 1. 頂部總覽四欄
      document.getElementById('stat-uptime').textContent = uptimePct !== 'N/A' ? `${uptimePct}%` : 'N/A';
      document.getElementById('stat-online').textContent = `${String(onlineCount).padStart(2, '0')} / ${total}`;
      document.getElementById('stat-offline').textContent = String(offlineCount).padStart(2, '0');
      document.getElementById('stat-interval').textContent = `${pollIntervalSeconds}s`;

      // 2. 故障通知橫條
      const incidentBanner = document.getElementById('incident-banner');
      const incidentText = document.getElementById('incident-text');
      const incidentBtn = document.getElementById('incident-filter-btn');

      if (offlineCount > 0) {
        incidentBanner.style.display = 'flex';
        incidentText.textContent = t.incidentFound.replace('%d', offlineCount);
        incidentBtn.textContent = currentFilter === 'issues' ? t.btnViewAll : t.btnViewIssues;
      } else {
        incidentBanner.style.display = 'none';
      }

      // 3. 篩選標籤數字更新
      document.getElementById('filter-all').textContent = `${t.filterAll} (${total})`;
      document.getElementById('filter-issues').textContent = `${t.filterIssues} (${offlineCount})`;
      document.getElementById('filter-healthy').textContent = `${t.filterHealthy} (${onlineCount})`;

      // 4. 群組分類劃分
      const groups = {
        'net': services.filter(s => s.category && s.category.includes('NET')),
        'aime': services.filter(s => s.category && s.category.includes('Aime')),
        'web': services.filter(s => s.category && s.category.includes('Web'))
      };

      for (const [key, list] of Object.entries(groups)) {
        const tableEl = document.getElementById(`table-cat-${key}`);
        const badgeEl = document.getElementById(`badge-cat-${key}`);
        if (!tableEl) continue;

        const groupOffline = list.filter(s => !s.is_online).length;
        if (badgeEl) {
          badgeEl.textContent = `${list.length - groupOffline} 正常 · ${groupOffline} 異常`;
          if (groupOffline > 0) {
            badgeEl.className = 'group-badge has-issue';
          } else {
            badgeEl.className = 'group-badge';
          }
        }

        // 分組內排序：異常置頂
        const sorted = sortServicesInGroup(list);
        tableEl.innerHTML = '';

        let visibleCount = 0;

        sorted.forEach((s, idx) => {
          const badge = getStatusBadgeInfo(s, t);
          const diag = s.diagnostics || {};
          const hist = s.history || [];
          const domain = s.url.replace(/^https?:\/\//, '').replace(/\/$/, '');
          const itemId = `item-${key}-${idx}`;
          const drawerId = `drawer-${key}-${idx}`;

          // 比對搜尋與過濾
          const matchSearch = !currentSearchQuery || 
            s.name.toLowerCase().includes(currentSearchQuery) || 
            domain.toLowerCase().includes(currentSearchQuery);

          let matchFilter = true;
          if (currentFilter === 'issues') matchFilter = !s.is_online;
          if (currentFilter === 'healthy') matchFilter = s.is_online;

          const isVisible = matchSearch && matchFilter;
          if (isVisible) visibleCount++;

          const itemDiv = document.createElement('div');
          itemDiv.className = 'service-item';
          itemDiv.dataset.url = s.url;
          itemDiv.dataset.name = s.name;
          itemDiv.dataset.online = String(s.is_online);
          itemDiv.style.display = isVisible ? 'block' : 'none';

          const sparklineHtml = generateSparklineSVG(hist, t);
          const errorDetailText = s.error_detail || s.reason || '正常運作中';

          itemDiv.innerHTML = `
            <div class="service-row" role="button" tabindex="0" aria-expanded="false" aria-controls="${drawerId}">
              <div class="service-main">
                <span class="beacon ${s.is_online ? 'online' : 'offline'}" aria-hidden="true"></span>
                <div>
                  <span class="service-name">${s.name}</span>
                  <span class="service-domain">${domain}</span>
                </div>
              </div>
              <div class="service-side">
                <div class="sparkline-box" title="近期延遲趨勢 (最多 1 小時)">
                  ${sparklineHtml}
                </div>
                <span class="service-tag ${badge.cssClass}">${badge.text}</span>
                <svg class="expand-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </div>
            </div>
            <div class="service-drawer" id="${drawerId}">
              <div class="diag-banner">
                <strong>${t.diagTitle}</strong>${errorDetailText}
              </div>
              <div class="diag-grid">
                <div class="diag-card">
                  <div class="diag-lbl">${t.diagLastSuccess}</div>
                  <div class="diag-val">${formatTime(diag.last_success_at)}</div>
                </div>
                <div class="diag-card">
                  <div class="diag-lbl">${t.diagLastFailure}</div>
                  <div class="diag-val">${formatTime(diag.last_failure_at)}</div>
                </div>
                <div class="diag-card">
                  <div class="diag-lbl">${t.diagConsecutiveFails}</div>
                  <div class="diag-val" style="color: ${diag.consecutive_failures > 0 ? 'var(--color-error)' : 'var(--color-success)'};">
                    ${diag.consecutive_failures || 0}${t.diagTimes}
                  </div>
                </div>
                <div class="diag-card">
                  <div class="diag-lbl">${t.diagRecentUptime}</div>
                  <div class="diag-val">
                    ${typeof diag.recent_uptime_percent === 'number' ? diag.recent_uptime_percent.toFixed(1) + '%' : '100%'}
                    (${diag.sample_count || hist.length}${t.diagSamples})
                  </div>
                </div>
              </div>
              <div class="diag-footer">
                <span>${t.diagSpec}</span>
                <a href="${s.url}" target="_blank" rel="noopener noreferrer" class="diag-link">
                  ${t.diagOpenSite}
                </a>
              </div>
            </div>
          `;

          // 綁定點擊展開抽屜與鍵盤操作
          const rowEl = itemDiv.querySelector('.service-row');
          const toggleDrawer = () => {
            const isOpen = itemDiv.classList.toggle('is-open');
            rowEl.setAttribute('aria-expanded', String(isOpen));
          };

          rowEl.addEventListener('click', toggleDrawer);
          rowEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              toggleDrawer();
            }
          });

          tableEl.appendChild(itemDiv);
        });

        if (visibleCount === 0) {
          const emptyDiv = document.createElement('div');
          emptyDiv.className = 'empty-state';
          emptyDiv.textContent = t.emptyFilter;
          tableEl.appendChild(emptyDiv);
        }
      }

      // 5. 頁尾快照時間
      if (data.updated_at) {
        const d = new Date(data.updated_at);
        document.getElementById('footer-updated').textContent = t.footerUpdatePrefix + d.toLocaleString(currentLang, { hour12: false });
      }
    }

    // ── 篩選切換 ──
    function setFilter(filterType) {
      currentFilter = filterType;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.filter === filterType) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      if (latestData) {
        renderAll(latestData);
      }
    }

    document.getElementById('filter-all').addEventListener('click', () => setFilter('all'));
    document.getElementById('filter-issues').addEventListener('click', () => setFilter('issues'));
    document.getElementById('filter-healthy').addEventListener('click', () => setFilter('healthy'));

    document.getElementById('incident-filter-btn').addEventListener('click', () => {
      setFilter(currentFilter === 'issues' ? 'all' : 'issues');
    });

    // ── 即時搜尋 ──
    const searchInput = document.getElementById('service-search');
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        currentSearchQuery = e.target.value.trim().toLowerCase();
        if (latestData) {
          renderAll(latestData);
        }
      });
    }

    // ── 狀態數據拉取 ──
    async function loadStatus() {
      if (isFetching) return;
      isFetching = true;

      const refreshBtn = document.getElementById('refresh-btn');
      const t = I18N[currentLang];
      if (refreshBtn) {
        refreshBtn.disabled = true;
        refreshBtn.textContent = t.refreshingBtn;
      }

      try {
        const res = await fetch('./status.json?t=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        renderAll(data);
        secondsToNextPoll = pollIntervalSeconds;
      } catch (err) {
        console.warn('載入 status.json 失敗，保留既有資料:', err);
        const footerUpdated = document.getElementById('footer-updated');
        if (footerUpdated) {
          footerUpdated.textContent = t.footerFetchError;
        }
      } finally {
        isFetching = false;
        if (refreshBtn) {
          refreshBtn.disabled = false;
          refreshBtn.textContent = t.refreshBtn;
        }
      }
    }

    const refreshBtn = document.getElementById('refresh-btn');
    if (refreshBtn) {
      refreshBtn.addEventListener('click', () => {
        loadStatus();
      });
    }

    // ── 秒數倒數計時 ──
    setInterval(() => {
      secondsToNextPoll--;
      if (secondsToNextPoll <= 0) {
        secondsToNextPoll = pollIntervalSeconds;
        loadStatus();
      }
      const t = I18N[currentLang];
      const footerSys = document.getElementById('footer-system-text');
      if (footerSys) {
        footerSys.textContent = t.footerSystem + t.footerCountdown.replace('%s', secondsToNextPoll);
      }
    }, 1000);

    // ── 初始化 ──
    applyLanguage(currentLang);
    updateThemeBtnText();
    loadStatus();
  </script>
</body>
</html>
