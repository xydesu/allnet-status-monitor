name: ALL.Net Status Sentinel & GitHub Pages Auto-Update

on:
  schedule:
    # 每 10 分鐘自動檢測並更新一次 (UTC 時間)
    - cron: '*/10 * * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動一鍵點擊立即更新
  push:
    branches: [ master, main ]
    paths:
      - 'config.json'
      - 'monitor.py'

permissions:
  contents: write

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 執行服務檢測與 Webhook 推播
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          python monitor.py --once

      - name: 檢查快照變更並自動提交回倉庫 (Git Commit & Push)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 檢查是否有檔案變動 (status.json, state.json)
          if [[ -n $(git status --porcelain status.json state.json) ]]; then
            echo "偵測到狀態快照更新，正在提交變更..."
            git add status.json state.json
            git commit -m "chore(telemetry): 自動更新 ALL.Net 服務狀態快照 [skip ci]"
            git push
          else
            echo "狀態無變動，略過提交。"
          fi
